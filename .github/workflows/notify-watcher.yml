name: Notify Watcher

on:
  push:
    paths:
      - 'sdk/ai/azure-ai-agents/samples/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 #get full history so git diff works
          ref: main #ensures origin/main is available
          
      - name: Get updated .py files in samples/
        id: changes
        run: |
          git fetch --no-tags --prune --depth=2 origin main
          CHANGED=$(git diff --name-only HEAD^ HEAD | grep 'sdk/ai/azure-ai-agents/samples/' | grep '\.py$' || true)
          UPDATED_JSON=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<< "$CHANGED")
          echo "updated_files<<EOF" >> $GITHUB_OUTPUT
          echo "$UPDATED_JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          
      - name: Trigger Watcher repo workflow
        run: |
          curl -X POST https://api.github.com/repos/mayaealexander/watcher-repo/dispatches \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.SDK_REPO_PAT }}" \
          -d "$(jq -n \
            --arg event_type "sdk-updated" \
            --argjson client_payload "{\"updated_files\": $UPDATED_JSON}" \
            '{event_type: $event_type, client_payload: ($client_payload | fromjson)}')"
