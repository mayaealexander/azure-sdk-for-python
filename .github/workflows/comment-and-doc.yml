name: Comment & Doc

#Fire only when a commit to main touches a .py file in samples/
on:
  push:
    branches: [main]
    paths:
      - 'sdk/ai/azure-ai-agents/samples/**/*.py'

jobs:

  comment-samples:
  #skip if this commit was made by the AI Comment Assistant
    if: ${{ !contains(github.event.head_commit.message, '[skip comment]') }}
    runs-on: ubuntu-latest

    permissions:
      contents: write #allows committing/pushing back
    
    steps:
      # 1 Checkout the SDK repo
      - name: Checkout SDK Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      # DEBUG (remove after confirming)
      - name: DEBUG – show files in this commit
        run: git diff-tree --no-commit-id --name-only -r ${{ github.sha }}

      - name: Build list of changed samples
        run: |
          git diff --name-only ${{ github.sha }} ${{ github.sha }}^ -- 'sdk/ai/azure-ai-agents/samples/**/*.py' > /tmp/updated_files.txt
          echo "Files to comment:" && cat /tmp/updated_files.txt
          
      - name: DEBUG – show files in /tmp
        run: ls -l /tmp && cat /tmp/updated_files.txt

      - name: Run AI commenting script
        run: python tools/generate_comments_AOAI.py /tmp/updated_files.txt .
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}

      - name: Commit and push changes
        run: |
          git config user.name "AI Comment Assistant"
          git config user.email "mayaealexander@users.noreply.github.com"
          git add sdk/ai/azure-ai-agents/samples/
          git diff --cached --quiet || git commit -m "Add inline comments via AI assistant [skip comment]"
          git push origin HEAD:main

