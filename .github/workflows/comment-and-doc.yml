name: Comment & Doc

#Fire only when a commit to main touches a .py file in samples/
on:
  push:
    branches: [main]
    paths:
      - 'sdk/ai/azure-ai-agents/samples/**/*.py'

jobs:

  comment-samples:
  #skip if this commit was made by the AI Comment Assistant
    if: github.event.head_commit.author.name != 'AI Comment Assistant'
    runs-on: ubuntu-latest

    permissions:
      contents: write #allows committing/pushing back
    
    steps:
      # 1 Checkout the SDK repo
      - name: Checkout SDK Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.SDK_REPO_PAT }}
          path: python-sdk

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Build list of changed samples
        run: |
          git diff --name-only origin/main | grep 'samples/' | grep '\.py$' > /tmp/updated_files.txt

      - name: List changed sample files
        run: cat /tmp/updated_files.txt

      - name: Run AI commenting script
        run: python generate_comments_AOAI.py /tmp/updated_files.txt python-sdk
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}

      - name: Commit and push changes
        run: |
          cd python-sdk
          git config user.name "AI Comment Assistant"
          git config user.email "mayaealexander@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Add inline comments via AI assistant [skip comment]"
          git push origin main
